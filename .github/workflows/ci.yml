name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Lua 5.2
        run: sudo apt-get update && sudo apt-get install --yes lua5.2 lua-cjson
      - name: Test repository tooling
        run: python -m unittest discover -s tests -v
      - name: Validate package manifest
        run: python tools/ccpm_ci.py validate
      - name: Check Lua syntax
        run: git ls-files -z -- '*.lua' | xargs -0 -r -n1 luac5.2 -p
      - name: Test ccpm runtime
        run: CCPM_TEST_ROOT="$PWD" lua5.2 tests/ccpm_runtime_test.lua
      - name: Test against pinned CraftOS APIs
        run: |
          python tools/fetch_ccpm_test_apis.py "$RUNNER_TEMP/ccpm-apis"
          CCPM_TEST_ROOT="$PWD" CCPM_UPSTREAM_DIR="$RUNNER_TEMP/ccpm-apis" lua5.2 tests/ccpm_runtime_test.lua
      - name: Install pinned CraftOS-PC 2.8.3
        run: |
          sudo apt-get install --yes libpulse0 libxss1 libasound2t64
          mkdir -p "$RUNNER_TEMP/craftos"
          cd "$RUNNER_TEMP/craftos"
          curl --fail --location --retry 3 -o craftos.AppImage https://github.com/MCJack123/craftos2/releases/download/v2.8.3/CraftOS-PC.x86_64.AppImage
          echo 'f25536c7a05f67827fe44573ff65627cbe595e13c75815ef86a4e1f3bd33a88c  craftos.AppImage' | sha256sum --check
          chmod +x craftos.AppImage
          ./craftos.AppImage --appimage-extract > /dev/null
      - name: Test real CraftOS I/O and boot recovery
        run: python tools/run_craftos_smoke.py --craftos "$RUNNER_TEMP/craftos/squashfs-root/AppRun" --output "$RUNNER_TEMP/craftos-smoke"
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: craftos-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/craftos-smoke/
          if-no-files-found: ignore
      - name: Build distributable
        run: python tools/ccpm_ci.py build dist
      - uses: actions/upload-artifact@v4
        with:
          name: ccpm-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
