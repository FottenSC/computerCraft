name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate release version
        run: python tools/ccpm_ci.py release-check "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          name: ccpm-${{ github.sha }}
          path: dist
      - name: Verify tested distribution
        working-directory: dist
        run: sha256sum --check checksums.sha256
      - name: Archive complete distribution
        run: tar -czf ccpm.tar.gz -C dist .
      - name: Prepare draft release for acceptance testing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --latest=false)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" ccpm.tar.gz dist/bootstrap.lua dist/ccpm.lua dist/startup.lua dist/ccpm-package.json dist/index.json dist/checksums.sha256 --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${flags[@]}"
